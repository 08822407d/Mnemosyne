      no per-call sequence/timestamps in the receipt, so ordering vs typing vs
      unordered-list artifact cannot be separated - the irresolvability is itself the
      finding motivating the per-call receipt schema
    content_addressing_principle: local computability guarantees only "if present then this
      ID", never existence; GitHub validates referenced SHAs against the target repo's
      object store at call time
    normative_correct_ordering: create_blob(base64) -> returned SHA recorded -> returned SHA
      == locally precomputed git blob SHA-1 -> readback fetch + SHA-256 compare ->
      single create_tree(base_tree, flat slash paths, 100644/blob) -> recursive candidate-tree
      fetch, changed-path set == allowlist string-exact + entry SHAs == recorded blob SHAs ->
      create_commit(parents=[base]) -> non-force fast-forward update_ref -> post-ref readback
    typing_rule: flat-path + base_tree lets the server synthesize subtrees (removes the
      typing surface); bottom-up assembly, if ever used, must type directories 040000/tree
      and leaf files 100644/blob
    proves: [object API reachable/writable from current surface, unreferenced side effects
