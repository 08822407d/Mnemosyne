# Guard registry — navigation index only (created by MNEMOSYNE-245)
#
# 中文说明：本文件是行为规范（guard）的导航索引与加载调度表，属 L3 导航层。
# 它不授予任何强制力：约束力仅来自可追溯的 Owner 批准与各 guard 自声明的 scope
# （执行源 §20 行为约束原则）。未在本表登记的文件不因此获得或失去效力；
# 登记状态仅影响"会不会被按触发条件找到"。
#
# maintenance_rules:
#   - guard 的新建/修订/合并/降级/退役任务必须同批更新本表（读-占-写同批纪律）。
#   - load_class 变更（尤其进入 core）需要 Owner 显式批准理由，记录在 core_reason。
#   - last_confirmed_current 在整编评审时全量刷新。
#
# consolidation_triggers（校准值，非执行源权威；首个周期为参数校准运行）:
#   - scope 重叠或规则冲突被发现
#   - 加载预算越界（core 集显著增长）
#   - 同一事故催生重复规则
#   - Owner 点名
#   - 新增满 3 份 guard 或距上次整编满 8 周（先到先触发）
# last_consolidation: none_yet（本表创建即基线）
#
# layered_loading_status: shadow_pilot_first_cycle（调度表见 commands/load-mnemosyne-guidance.md）
#
# shadow_pilot_miss_log:
#   - date: 2026-08-30
#     tasks: MNEMOSYNE-251/253/254/256（跨对话任务包起草）
#     missed_guards: [artifact-delivery-and-direct-generation, cross-conversation-execution-intent-and-operator-flow]
#     consequence: 任务书未要求完整回复转移文件；未用 project-knowledge 专用文件夹 → Owner 多耗动作与额度
#     caught_by: Owner（登记簿 C-20）
#     disposition: loader 触发行加注调度提示（非新规则）；执行者自纠

